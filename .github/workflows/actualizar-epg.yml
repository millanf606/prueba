name: Actualizar Programa EPG

on:
  schedule:
    - cron: '14,44 * * * *'
  # <--- workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4.2.2

      - name: Configurar Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '24' # <--- Cambiado de 20 a 22 o 24

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar script de actualización
        run: node actualizar_epg.js

      - name: Hacer Commit y Push si hubo cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --staged --quiet || (git commit -m "Auto-update: Programa EPG actualizado" && git push)
